<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StepToDeen</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d1b2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StepToDeen" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- SEO -->
    <meta name="description" content="اسلامی راہنمائی کا ڈیجیٹل ساتھی — نماز اوقات، قرآن، تسبیح" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" />
    </noscript>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      media="print"
      onload="this.media='all'"
    />

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { margin: 0; background: #ffffff; color: #1e293b; font-family: sans-serif; }
      #root { min-height: 100vh; }

      .app-splash {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #ffffff;
        flex-direction: column;
        gap: 28px;
      }

      /* ویلکم میسج */
      .splash-welcome {
        font-family: 'Noto Nastaliq Urdu', sans-serif;
        font-size: 15px;
        color: #10b981;
        letter-spacing: 1px;
        opacity: 0;
        animation: fadeDown 0.8s ease forwards 0.2s;
      }

      /* مین ٹائٹل */
      .splash-title {
        font-family: sans-serif;
        font-size: 48px;
        font-weight: 900;
        color: #0d1b2a;
        letter-spacing: -1px;
        direction: ltr;
        text-align: center;
        line-height: 1;
        opacity: 0;
        animation: fadeDown 0.8s ease forwards 0.45s;
      }
      .splash-title em {
        font-style: normal;
        color: #10b981;
      }

      /* گول فرکی spinner */
      .splash-spinner {
        width: 42px;
        height: 42px;
        border: 3.5px solid #e2e8f0;
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        opacity: 0;
        animation: spin 0.9s linear infinite, fadeDown 0.8s ease forwards 0.7s;
      }

      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-splash">
        <div class="splash-welcome">خوش آمدید 🌿</div>
        <div class="splash-title">Step<em>To</em>Deen</div>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            console.log('SW registered:', reg.scope);
            if ('sync' in reg) {
              await reg.sync.register('prayer-times-sync');
            }
            if ('periodicSync' in reg) {
              const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
              if (status.state === 'granted') {
                await reg.periodicSync.register('daily-prayer-update', {
                  minInterval: 24 * 60 * 60 * 1000
                });
              }
            }
          } catch (err) {
            console.log('SW error:', err);
          }
        });
      }
    </script>
  </body>
</html>
