<!doctype html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StepToDeen</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d1b2a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StepToDeen" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- SEO -->
    <meta name="description" content="اسلامی راہنمائی کا ڈیجیٹل ساتھی — نماز اوقات، قرآن، تسبیح" />

    <!-- FIX 1: Preconnect to speed up external requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <!-- FIX 2: Load fonts with display=swap and non-blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- FIX 3: Font Awesome — only load icons actually used (defer) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      media="print"
      onload="this.media='all'"
    />

    <!-- FIX 4: Inline critical CSS for first paint — no FOUC -->
    <style>
      body { margin: 0; background: #f4f6f4; color: #1e293b; font-family: sans-serif; }
      #root { min-height: 100vh; }
      /* Skeleton loader while JS boots */
      .app-splash {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; background: #0d1b2a;
        flex-direction: column; gap: 12px;
      }
      .app-splash-icon { font-size: 48px; }
      .app-splash-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: #10b981; display: inline-block;
        animation: pulse 1.2s ease-in-out infinite;
      }
      .app-splash-dot:nth-child(2) { animation-delay: 0.2s; }
      .app-splash-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse { 0%,80%,100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body class="bg-[#f4f6f4] text-slate-800">
    <!-- FIX 5: Show instant splash while React boots -->
    <div id="root">
      <div class="app-splash">
        <div class="app-splash-icon">🕌</div>
        <div style="display:flex;gap:6px">
          <div class="app-splash-dot"></div>
          <div class="app-splash-dot"></div>
          <div class="app-splash-dot"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker + Background Sync + Periodic Sync -->
    <script>
      if ('serviceWorker' in navigator) {
        // FIX 6: Don't block page load — register SW after load event
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            console.log('SW registered:', reg.scope);
            if ('sync' in reg) {
              await reg.sync.register('prayer-times-sync');
            }
            if ('periodicSync' in reg) {
              const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
              if (status.state === 'granted') {
                await reg.periodicSync.register('daily-prayer-update', {
                  minInterval: 24 * 60 * 60 * 1000
                });
              }
            }
          } catch (err) {
            console.log('SW error:', err);
          }
        });
      }
    </script>
  </body>
</html>
